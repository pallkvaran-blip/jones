<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hustle City — Life in the Fast Lane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0d1a; overflow: hidden;
      display: flex; flex-direction: row;
    }
    /* Three-column layout: action panel | game board | stats panel */
    #left-slot        { width: 200px; flex-shrink: 0; height: 100%; position: relative; }
    #canvas-container { flex: 1;      height: 100%; position: relative; overflow: hidden; }
    #right-slot       { width: 280px; flex-shrink: 0; height: 100%; position: relative; }
    /* Full-screen overlay root for modals, menus, game-over, turn-handoff */
    #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
    #ui-root > * { pointer-events: auto; }
    /* Mobile portrait: vertical stack — stats top, map middle, actions bottom */
    @media (max-width: 600px) {
      html, body        { flex-direction: column; overflow: hidden; }
      #right-slot       { order: 1; width: 100%; height: 30vh; flex-shrink: 0; position: relative; overflow: hidden; }
      #canvas-container { order: 2; width: 100%; height: 75vw; max-height: 45vh; flex: none; flex-shrink: 0; position: relative; overflow: hidden; }
      #left-slot        { order: 3; width: 100%; flex: 1; min-height: 120px; position: relative; overflow: hidden; }
    }
  </style>
</head>
<body>
  <div id="left-slot"></div>
  <div id="canvas-container"></div>
  <div id="right-slot"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
